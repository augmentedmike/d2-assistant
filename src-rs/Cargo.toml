[package]
name = "d2-assistant"
version = "0.2.0"
description = "A safer, searchable item bank for offline Diablo II: Lord of Destruction."
authors = ["augmentedmike"]
license = "MIT"
repository = "https://github.com/augmentedmike/d2-assistant"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "d2_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
tauri = { version = "2.12.7", features = [] }
thiserror = "2"
rusqlite = { version = "0.41", features = ["bundled"] }
d2s = "0.1.1"
tauri-plugin-dialog = "2.8.4"
