name: Desktop build check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-build-check.yml'
      - 'src-rs/**'
      - 'src-ts/**'
      - 'public/**'
      - 'package.json'
      - 'bun.lock'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: msi,nsis
            artifact-path: |
              src-rs/target/release/bundle/msi/*.msi
              src-rs/target/release/bundle/nsis/*.exe
          - platform: ubuntu-22.04
            bundles: appimage,deb
            artifact-path: |
              src-rs/target/release/bundle/appimage/*.AppImage
              src-rs/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-rs -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 \
            libwebkit2gtk-4.1-dev xdg-utils
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build native installer packages
        run: bun run tauri:build -- --bundles ${{ matrix.bundles }}
      - name: Upload installer artifacts for manual review
        uses: actions/upload-artifact@v4
        with:
          name: d2-assistant-${{ matrix.platform }}-installers
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 7
