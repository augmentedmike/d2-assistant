name: Release desktop installers

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            rust-target: aarch64-apple-darwin
            bundles: dmg
          - platform: macos-latest
            rust-target: x86_64-apple-darwin
            bundles: dmg
          - platform: windows-latest
            rust-target: ''
            bundles: msi,nsis
          - platform: ubuntu-22.04
            rust-target: ''
            bundles: appimage,deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-rs -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 \
            libwebkit2gtk-4.1-dev xdg-utils
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build and upload installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: D2 Assistant ${{ github.ref_name }}
          releaseBody: |
            Initial release for offline original Diablo II + Lord of Destruction save management.

            **D2R and online/Battle.net save files are not supported.** Optional D2R/Reign runeword references are informational only.

            Keep independent backups. Stash import creates a verified backup and empties the selected stash; character exports create `_d2a` copies.
          releaseDraft: true
          prerelease: false
          args: --config src-rs/tauri.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.rust-target != '' && format('--target {0}', matrix.rust-target) || '' }}

  publish:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release after every platform build succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
