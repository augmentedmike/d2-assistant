name: Quality gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf \
            libwebkit2gtk-4.1-dev xdg-utils
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build frontend
        run: bun run build
      - name: Test frontend logic
        run: bun run test:frontend
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-rs/Cargo.toml -- --check
      - name: Lint Rust backend
        run: bun run lint:rust
      - name: Check code duplication
        run: bun run metrics:duplication
      - name: Report function complexity
        run: bun run metrics:complexity
      - name: Test Rust backend
        run: bun run test:rust
